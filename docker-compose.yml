services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ipchk-cn:latest
    container_name: ipw-backend
    network_mode: host
    volumes:
      - ./ipdb-files:/app/tmp
    environment:
      - BLOCK_PRIVATE_IPS=true
      - PORTS=8080
      # 本地默认 false（跳过数据库下载，purity 走在线源）；生产部署设 IPDB=true
      - IPDB=${IPDB:-false}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ipchk-cn-frontend:latest
    container_name: ipw-frontend
    network_mode: host
    environment:
      - PORT=3000
    depends_on:
      - backend
    restart: unless-stopped
