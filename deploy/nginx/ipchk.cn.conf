# ipchk.cn - IP 查询工具反向代理
# 80 与 443 行为完全一致：curl/wget 出 IP，浏览器出页面，API 相同

# HTTP (80) — 双栈监听
server {
    listen 80;
    listen [::]:80;
    server_name ipchk.cn www.ipchk.cn 4.ipchk.cn 6.ipchk.cn;

    # Let's Encrypt HTTP-01 验证（acme.sh webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/ipchk-stats/;
    }

    include /etc/openresty/conf.d/ipchk-locations.inc;
}

# HTTPS (443) — 双栈监听
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ipchk.cn www.ipchk.cn 4.ipchk.cn 6.ipchk.cn;

    # SSL 证书配置
    ssl_certificate     /etc/openresty/ssl/ipchk.cn/www.ipchk.cn.pem;
    ssl_certificate_key /etc/openresty/ssl/ipchk.cn/www.ipchk.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/openresty/conf.d/ipchk-locations.inc;
}
